<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Léxora • Administração</title><link rel="stylesheet" href="styles/main.css?v=11"></head>
<body class="admin-page"><div class="world" aria-hidden="true"><i></i><i></i><i></i></div><main class="admin-shell">
